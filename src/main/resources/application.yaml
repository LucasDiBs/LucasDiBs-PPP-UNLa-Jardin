    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:tu_correo@gmail.com}
    password: ${MAIL_PASSWORD:contraseña_de_prueba}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true