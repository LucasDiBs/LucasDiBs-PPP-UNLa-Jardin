spring:
  application:
    name: jardin

  datasource:
    url: jdbc:mysql://localhost:3306/jardin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${User}
    password: ${Password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect