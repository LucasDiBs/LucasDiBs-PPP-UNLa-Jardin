spring:
  application:
    name: jardin
  
  datasource:
    url: jdbc:mysql://localhost:3306/jardin_unla
    username: root
    password: root12345678
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    database: mysql
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

